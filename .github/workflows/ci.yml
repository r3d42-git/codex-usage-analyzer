name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run unit tests
        run: swift test
      - name: Build Xcode app
        run: xcodebuild -project CodexUsageAnalyzer.xcodeproj -scheme 'Codex Usage Analyzer' -configuration Debug CODE_SIGNING_ALLOWED=NO build
